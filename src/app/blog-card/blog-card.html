<mat-card class="blog-card" appearance="outlined" (click)="openBlog()">
  @if (blog().headerImageUrl) {
    <img class="blog-card__image" matCardImage [src]="blog().headerImageUrl" [alt]="blog().title" />
  } @else {
    <img
      class="blog-card__image"
      matCardImage
      src="/images/blog-placeholder-image.jpg"
      alt="Platzhalterbild"
    />
  }

  <mat-card-header class="blog-card__header">
    <mat-card-title>{{ blog().title }}</mat-card-title>
    <mat-card-subtitle>{{ blog().author }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="blog-card__content">
    <p>{{ blog().contentPreview }}</p>
  </mat-card-content>

  <mat-card-actions class="blog-card__actions">
    <button mat-icon-button type="button" (click)="onLike($event)">
      <mat-icon>
        {{ blog().likedByMe ? 'favorite' : 'favorite_border' }}
      </mat-icon>
    </button>

    <span>{{ blog().likes }}</span>

    <button mat-button type="button">SHARE</button>
  </mat-card-actions>
</mat-card>
